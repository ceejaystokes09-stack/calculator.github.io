<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/304058e96a.js" crossorigin="anonymous"></script>
    <title>Calculator -> calculate the world</title>
</head>
<body>
    <div class="input-screen">
        <p>0</p>
    </div>
    <div class="input-bttns">
        <button class="bttn-top" onclick="math('m')"><i class="fa-solid fa-delete-left"></i></button>
        <button class="bttn-top" onclick="math('AC')">AC</button>
        <button class="bttn-top" onclick="math('%')">%</button>
        <button class="btt-important" onclick="math('/')"><i class="fa-solid fa-divide"></i></button>
        <button onclick="math(7)">7</button>
        <button onclick="math(8)">8</button>
        <button onclick="math(9)">9</button>
        <button class="btt-important" onclick="math('*','X')">X</button>
        <button onclick="math(4)">4</button>
        <button onclick="math(5)">5</button>
        <button onclick="math(6)">6</button>
        <button class="btt-important" onclick="math('-')">-</button>
        <button onclick="math(1)">1</button>
        <button onclick="math(2)">2</button>
        <button onclick="math(3)">3</button>
        <button class="btt-important" onclick="math('+')">+</button>
        <button onclick="math('c')"><i class="fa-solid fa-plus-minus"></i></button>
        <button onclick="math(0)">0</button>
        <button onclick="math('.')">.</button>
        <button class="btt-important" onclick="math('=')">=</button>
    </div>
</body>
<script src="index.js"></script>
</html>
